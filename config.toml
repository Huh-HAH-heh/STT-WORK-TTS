[app]
log_level = "INFO"

[audio]
sample_rate = 16000
max_recording_seconds = 90
save_recordings = false
recording_dir = "data/recordings"

[stt]
model_dir = "assets/models/vosk-model-small-ru-0.22"
sample_rate = 16000

[work]
notes_file = "data/notes.txt"
# Notes are kept in memory unless this is explicitly enabled.
save_notes = false

[tts]
voice = "female"
cpu_threads = 1
female_model = "assets/voices/ru_RU-irina-medium.onnx"
male_model = "assets/voices/ru_RU-denis-medium.onnx"
play_audio = true
save_speech = false
speech_dir = "data/speech"
