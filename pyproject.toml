[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-work-tts"
version = "0.2.0"
description = "Компактный полностью локальный голосовой помощник"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sounddevice==0.5.6",
    "vosk==0.3.45",
    "piper-tts==1.8.0",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
stt-work-tts = "stt_work_tts.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
