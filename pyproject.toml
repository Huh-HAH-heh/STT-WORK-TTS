[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-work-tts"
version = "0.1.0"
description = "Локальный голосовой помощник: запись, STT, обработка текста и TTS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "faster-whisper>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
tts = ["qwen-tts"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
stt-work-tts = "stt_work_tts.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
