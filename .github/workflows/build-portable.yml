name: Build C# offline Windows archive

on:
  push:
    branches:
      - feature/csharp-rewrite
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csharp-offline-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build self-contained archive
        shell: powershell
        run: .\build_portable.ps1 -Clean

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: STT-WORK-TTS-Windows-x64
          path: STT-WORK-TTS-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
