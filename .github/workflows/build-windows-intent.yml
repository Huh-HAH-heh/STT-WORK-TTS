name: Build full-feature laptop package

on:
  push:
    branches:
      - feature/lightweight-offline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build self-contained laptop ZIP
        shell: powershell
        run: .\build_portable.ps1 -Clean

      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: STT-WORK-TTS-Laptop-x64
          path: |
            STT-WORK-TTS-Windows-x64.zip
            STT-WORK-TTS-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Set up Python for adapter syntax validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile local TTS worker scripts
        run: |
          python -m py_compile .\tools\tts-runtime\silero_worker.py
          python -m py_compile .\tools\tts-runtime\xvibe_worker.py
          python -m py_compile .\tools\tts-lab\python\silero_batch.py

      - name: Parse PowerShell scripts with Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = Get-ChildItem -Path . -Filter "*.ps1" -Recurse |
            Where-Object { $_.FullName -notmatch "[\\\\/]vendor[\\\\/]|[\\\\/]envs[\\\\/]" }

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($script.FullName)" -ForegroundColor Red
              $errors | Format-List *
              throw "PowerShell parser failed."
            }

            Write-Host "OK: $($script.FullName)" -ForegroundColor Green
          }
