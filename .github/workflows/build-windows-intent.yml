name: Build and validate Windows intent engine

on:
  push:
    branches:
      - feature/windows-voice-intents
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build C# application
        run: dotnet build .\src\STT.WorkTTS\STT.WorkTTS.csproj --configuration Release

      - name: Parse PowerShell scripts with Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = Get-ChildItem -Path . -Filter "*.ps1" -Recurse |
            Where-Object { $_.FullName -notmatch "[\\\\/]vendor[\\\\/]|[\\\\/]envs[\\\\/]" }

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($script.FullName)" -ForegroundColor Red
              $errors | Format-List *
              throw "PowerShell parser failed."
            }

            Write-Host "OK: $($script.FullName)" -ForegroundColor Green
          }
